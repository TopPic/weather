<!doctype html>
<html lang="th" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        
        .card {
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
        }
        
        .weather-icon {
            font-size: 64px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 font-sans">
  <main class="min-h-full p-4 md:p-8">
   <div class="max-w-7xl mx-auto"><!-- Header -->
    <header class="mb-8">
     <div class="flex justify-between items-center">
      <div>
       <h1 id="dashboard-title" class="text-4xl font-bold text-white mb-2">Dashboard ของฉัน</h1>
       <p id="welcome-message" class="text-xl text-white opacity-90">สวัสดีตอนเช้า! 👋</p>
      </div>
      <div class="text-right">
       <div id="current-time" class="text-3xl font-bold text-white"></div>
       <div id="current-date" class="text-sm text-white opacity-90"></div>
      </div>
     </div>
    </header><!-- Weather Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6"><!-- Main Weather Card -->
     <div class="card stat-card bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl p-6 text-white">
      <div class="flex flex-col items-center">
       <div id="weather-icon" class="weather-icon mb-2">
        ☁️
       </div>
       <div id="temperature" class="text-3xl font-bold mb-1">
        31°C
       </div>
       <div id="city-name" class="text-sm opacity-90">
        Bangkok
       </div>
      </div>
     </div><!-- Wind Speed -->
     <div class="card stat-card bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl p-6 text-white">
      <div class="text-sm opacity-90 mb-2">
       💨 ความเร็วลม
      </div>
      <div id="wind-speed" class="text-4xl font-bold mb-1">
       1.18
      </div>
      <div class="text-xs opacity-75">
       m/s
      </div>
     </div><!-- Humidity -->
     <div class="card stat-card bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl p-6 text-white">
      <div class="text-sm opacity-90 mb-2">
       💧 ความชื้น
      </div>
      <div id="humidity" class="text-4xl font-bold mb-1">
       76
      </div>
      <div class="text-xs opacity-75">
       %
      </div>
     </div><!-- Feels Like -->
     <div class="card stat-card bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl p-6 text-white">
      <div class="text-sm opacity-90 mb-2">
       🌡️ รู้สึกเหมือน
      </div>
      <div id="feels-like" class="text-4xl font-bold mb-1">
       38
      </div>
      <div class="text-xs opacity-75">
       °C
      </div>
     </div>
    </div><!-- Weather Details -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6"><!-- Main Weather Card -->
     <div class="card bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center">
       <div id="weather-icon-large" class="text-8xl mb-4">
        ☁️
       </div>
       <div id="temperature-large" class="text-6xl font-bold text-gray-800 mb-2">
        31°C
       </div>
       <div id="city-name-large" class="text-2xl font-semibold text-gray-600 mb-2">
        Bangkok
       </div>
       <div id="description-large" class="text-lg text-gray-500 capitalize">
        เมฆมาก
       </div>
      </div>
     </div><!-- Weather Details -->
     <div class="card bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">รายละเอียด</h2>
      <div class="space-y-4">
       <div class="flex justify-between items-center p-4 bg-gradient-to-r from-blue-50 to-blue-100 rounded-xl">
        <div class="flex items-center gap-3"><span class="text-3xl">💨</span> <span class="text-gray-700 font-medium">ความเร็วลม</span>
        </div><span id="wind-speed-large" class="text-xl font-bold text-gray-800">1.18 m/s</span>
       </div>
       <div class="flex justify-between items-center p-4 bg-gradient-to-r from-cyan-50 to-cyan-100 rounded-xl">
        <div class="flex items-center gap-3"><span class="text-3xl">💧</span> <span class="text-gray-700 font-medium">ความชื้น</span>
        </div><span id="humidity-large" class="text-xl font-bold text-gray-800">76%</span>
       </div>
       <div class="flex justify-between items-center p-4 bg-gradient-to-r from-orange-50 to-orange-100 rounded-xl">
        <div class="flex items-center gap-3"><span class="text-3xl">🌡️</span> <span class="text-gray-700 font-medium">รู้สึกเหมือน</span>
        </div><span id="feels-like-large" class="text-xl font-bold text-gray-800">38°C</span>
       </div>
       <div class="flex justify-between items-center p-4 bg-gradient-to-r from-purple-50 to-purple-100 rounded-xl">
        <div class="flex items-center gap-3"><span class="text-3xl">☁️</span> <span class="text-gray-700 font-medium">สภาพอากาศ</span>
        </div><span id="description-detail" class="text-xl font-bold text-gray-800 capitalize">เมฆมาก</span>
       </div>
      </div>
     </div>
    </div>
   </div>
  </main>
  <script>
        // Configuration
        const defaultConfig = {
            dashboard_title: "Dashboard ของฉัน",
            welcome_message: "สวัสดีตอนเช้า! 👋",
            background_color: "#8b5cf6",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#a855f7",
            secondary_action_color: "#ec4899",
            font_family: "sans-serif",
            font_size: 16
        };

        // Weather icon mapping
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        // Initialize App
        async function initializeApp() {
            // Initialize Element SDK
            if (window.elementSdk) {
                window.elementSdk.init({
                    defaultConfig,
                    onConfigChange: async (config) => {
                        const customFont = config.font_family || defaultConfig.font_family;
                        const baseSize = config.font_size || defaultConfig.font_size;
                        const baseFontStack = 'system-ui, -apple-system, sans-serif';

                        // Update text content
                        document.getElementById('dashboard-title').textContent = config.dashboard_title || defaultConfig.dashboard_title;
                        document.getElementById('welcome-message').textContent = config.welcome_message || defaultConfig.welcome_message;

                        // Update colors
                        document.body.style.background = `linear-gradient(to bottom right, ${config.background_color || defaultConfig.background_color}, ${config.secondary_action_color || defaultConfig.secondary_action_color})`;

                        // Update fonts
                        document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;
                        document.getElementById('dashboard-title').style.fontSize = `${baseSize * 2}px`;
                        document.getElementById('welcome-message').style.fontSize = `${baseSize * 1.25}px`;
                    },
                    mapToCapabilities: (config) => ({
                        recolorables: [
                            {
                                get: () => config.background_color || defaultConfig.background_color,
                                set: (value) => {
                                    window.elementSdk.config.background_color = value;
                                    window.elementSdk.setConfig({ background_color: value });
                                }
                            },
                            {
                                get: () => config.surface_color || defaultConfig.surface_color,
                                set: (value) => {
                                    window.elementSdk.config.surface_color = value;
                                    window.elementSdk.setConfig({ surface_color: value });
                                }
                            },
                            {
                                get: () => config.text_color || defaultConfig.text_color,
                                set: (value) => {
                                    window.elementSdk.config.text_color = value;
                                    window.elementSdk.setConfig({ text_color: value });
                                }
                            },
                            {
                                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                                set: (value) => {
                                    window.elementSdk.config.primary_action_color = value;
                                    window.elementSdk.setConfig({ primary_action_color: value });
                                }
                            },
                            {
                                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                                set: (value) => {
                                    window.elementSdk.config.secondary_action_color = value;
                                    window.elementSdk.setConfig({ secondary_action_color: value });
                                }
                            }
                        ],
                        borderables: [],
                        fontEditable: {
                            get: () => config.font_family || defaultConfig.font_family,
                            set: (value) => {
                                window.elementSdk.config.font_family = value;
                                window.elementSdk.setConfig({ font_family: value });
                            }
                        },
                        fontSizeable: {
                            get: () => config.font_size || defaultConfig.font_size,
                            set: (value) => {
                                window.elementSdk.config.font_size = value;
                                window.elementSdk.setConfig({ font_size: value });
                            }
                        }
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ["dashboard_title", config.dashboard_title || defaultConfig.dashboard_title],
                        ["welcome_message", config.welcome_message || defaultConfig.welcome_message]
                    ])
                });
            }

            // Load weather data
            loadWeatherData();
            
            // Update time
            updateTime();
            setInterval(updateTime, 1000);
        }

        // Load Weather Data
        function loadWeatherData() {
            const weatherData = {
                "weather": [{"id": 804, "main": "Clouds", "description": "overcast clouds", "icon": "04d"}],
                "main": {"temp": 304.09, "feels_like": 311.09, "humidity": 76},
                "wind": {"speed": 1.18},
                "name": "Bangkok"
            };

            const iconCode = weatherData.weather[0].icon;
            const tempC = Math.round(weatherData.main.temp - 273.15);
            const feelsLikeC = Math.round(weatherData.main.feels_like - 273.15);
            const icon = weatherIcons[iconCode] || '🌤️';
            
            // Update stats row
            document.getElementById('weather-icon').textContent = icon;
            document.getElementById('temperature').textContent = `${tempC}°C`;
            document.getElementById('city-name').textContent = weatherData.name;
            document.getElementById('wind-speed').textContent = weatherData.wind.speed.toFixed(2);
            document.getElementById('humidity').textContent = weatherData.main.humidity;
            document.getElementById('feels-like').textContent = feelsLikeC;
            
            // Update weather page
            document.getElementById('weather-icon-large').textContent = icon;
            document.getElementById('temperature-large').textContent = `${tempC}°C`;
            document.getElementById('city-name-large').textContent = weatherData.name;
            document.getElementById('description-large').textContent = weatherData.weather[0].description;
            document.getElementById('wind-speed-large').textContent = `${weatherData.wind.speed} m/s`;
            document.getElementById('humidity-large').textContent = `${weatherData.main.humidity}%`;
            document.getElementById('feels-like-large').textContent = `${feelsLikeC}°C`;
            document.getElementById('description-detail').textContent = weatherData.weather[0].description;
        }

        // Update Time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString('th-TH', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            document.getElementById('current-time').textContent = timeStr;
            document.getElementById('current-date').textContent = dateStr;
        }

        // Initialize app
        initializeApp();
    </script>

</html>
